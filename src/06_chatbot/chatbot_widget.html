{# 담당자 F — AI 챗봇 위젯 (우하단 플로팅). base.html 마지막에 include 됩니다. 명세: src/06_chatbot/chatbot.md
   대화 처리는 /api/chatbot/message (app.py [F]) → 별도 챗봇 서버. 화면 동작은 chatbot.js, 스타일은 chatbot.css #}
<link rel="stylesheet" href="{{ url_for('asset', filename='06_chatbot/chatbot.css') }}">
<div class="chatbot" id="chatbot" data-endpoint="{{ url_for('chatbot_message') }}" data-login="{{ url_for('login') }}">

  <button class="chatbot__launcher" id="chatbot-launcher" type="button" aria-label="AI 비서 열기" aria-expanded="false" aria-controls="chatbot-panel">
    <img class="chatbot__launcher-open" src="{{ url_for('asset', filename='06_chatbot/images/chatbot_logo.png') }}" width="44" height="44" alt="" aria-hidden="true">
    <span class="chatbot__launcher-label" aria-hidden="true">AI 챗봇</span>
    <svg class="chatbot__launcher-close" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </button>

  <section class="chatbot__panel" id="chatbot-panel" role="dialog" aria-label="COSMOA AI 비서" hidden>
    <header class="chatbot__head">
      <span class="chatbot__avatar" aria-hidden="true">
        <img src="{{ url_for('asset', filename='06_chatbot/images/chatbot_logo.png') }}" width="32" height="32" alt="">
      </span>
      <div class="chatbot__title-wrap">
        <h2 class="chatbot__title">AI 비서</h2>
      </div>
      <button class="chatbot__iconbtn" id="chatbot-clear" type="button" title="대화 지우기" aria-label="대화 지우기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg>
      </button>
      <button class="chatbot__iconbtn" id="chatbot-close" type="button" aria-label="닫기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </header>

    <div class="chatbot__body" id="chatbot-messages" aria-live="polite">
      <div class="chatbot__empty" id="chatbot-empty">
        <p class="chatbot__empty-title">안녕하세요, 무엇을 도와드릴까요?</p>
        <p class="chatbot__empty-text">궁금한 점을 편하게 물어보세요.</p>
      </div>
    </div>

    <form class="chatbot__form" id="chatbot-form" autocomplete="off">
      <textarea class="form-control form-control-sm chatbot__input" id="chatbot-input" rows="1" maxlength="4000" placeholder="메시지를 입력하세요" title="Enter 전송 · Shift+Enter 줄바꿈" aria-label="메시지 입력"></textarea>
      <button class="btn btn-primary btn-icon chatbot__send" id="chatbot-send" type="submit" aria-label="보내기">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"></path></svg>
      </button>
    </form>
  </section>
</div>
<script src="{{ url_for('asset', filename='06_chatbot/chatbot.js') }}"></script>
